<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn Schoolagenda</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #1e293b;
    }

    header {
      padding: 30px 20px;
      background: linear-gradient(135deg, #4338ca, #7c3aed);
      color: white;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    main {
      width: min(1500px, calc(100% - 30px));
      margin: 25px auto;
    }

    .kaart {
      padding: 22px;
      margin-bottom: 22px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.08);
    }

    h2 {
      margin-top: 0;
      color: #4338ca;
    }

    .formulier {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .hele-breedte {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      border-color: #4f46e5;
      outline: none;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .toevoegen {
      width: 100%;
      background: #4f46e5;
      color: white;
    }

    .toevoegen:hover {
      background: #3730a3;
    }

    .legenda {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .legenda span {
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .weekbediening {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 15px;
    }

    .weekbediening h2 {
      margin: 0;
      text-align: center;
    }

    .weekbediening button {
      background: #e0e7ff;
      color: #3730a3;
    }

    .vandaag-knop {
      display: block;
      margin: 0 auto 20px;
      background: #4f46e5;
      color: white;
    }

    .agenda-buitenrand {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    #weekagenda {
      display: grid;
      grid-template-columns: repeat(7, minmax(170px, 1fr));
      gap: 10px;
      min-width: 1250px;
    }

    .dag {
      min-height: 420px;
      border: 1px solid #dbe3ee;
      border-radius: 12px;
      background: #f8fafc;
      overflow: hidden;
    }

    .dagkop {
      padding: 12px 8px;
      background: #e9eef6;
      text-align: center;
    }

    .dagkop h3 {
      margin: 0;
      font-size: 16px;
      text-transform: capitalize;
    }

    .dagkop p {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 13px;
    }

    .dag.vandaag {
      border: 2px solid #4f46e5;
    }

    .dag.vandaag .dagkop {
      background: #e0e7ff;
      color: #3730a3;
    }

    .taken {
      padding: 9px;
    }

    .geen-taken {
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
    }

    .taak {
      margin-bottom: 9px;
      padding: 10px;
      border-top: 6px solid;
      border-radius: 9px;
      background: white;
      box-shadow: 0 2px 7px rgba(15, 23, 42, 0.08);
    }

    .taak-bovenkant {
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }

    .afvinken {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .taak-inhoud {
      flex: 1;
      min-width: 0;
    }

    .vak {
      display: inline-block;
      padding: 4px 7px;
      margin-bottom: 6px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: bold;
    }

    .taak-tekst {
      margin: 0;
      font-size: 14px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .taak-soort {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 12px;
    }

    .toets-melding {
      color: #dc2626;
      font-weight: bold;
    }

    .taak.klaar {
      opacity: 0.45;
    }

    .taak.klaar .taak-tekst {
      text-decoration: line-through;
    }

    .verwijderen {
      width: 100%;
      margin-top: 9px;
      padding: 6px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .formulier {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .formulier {
        grid-template-columns: 1fr;
      }

      .hele-breedte {
        grid-column: auto;
      }

      .weekbediening button {
        padding: 8px;
        font-size: 12px;
      }

      .weekbediening h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Mijn Schoolagenda</h1>
    <p>Mijn schoolwerk overzichtelijk per week.</p>
  </header>

  <main>
    <section class="kaart">
      <h2>Schoolwerk inplannen</h2>

      <form id="taak-formulier">
        <div class="formulier">
          <div>
            <label for="datum">Dag</label>
            <input type="date" id="datum" required>
          </div>

          <div>
            <label for="vak">Vak</label>
            <select id="vak" required>
              <option value="">Kies een vak</option>
              <option value="Economie">Economie</option>
              <option value="Mens en maatschappij">Mens en maatschappij</option>
              <option value="Nederlands">Nederlands</option>
              <option value="Engels">Engels</option>
              <option value="Wiskunde">Wiskunde</option>
              <option value="Biologie">Biologie</option>
            </select>
          </div>

          <div>
            <label for="soort">Soort schoolwerk</label>
            <select id="soort">
              <option value="Huiswerk">Huiswerk</option>
              <option value="Toets">Toets</option>
              <option value="Leren">Leren</option>
              <option value="Werkstuk">Werkstuk</option>
              <option value="Presentatie">Presentatie</option>
            </select>
          </div>

          <div>
            <label for="omschrijving">Wat moet u doen?</label>
            <input
              type="text"
              id="omschrijving"
              placeholder="Bijvoorbeeld: hoofdstuk 3 leren"
              required
            >
          </div>

          <div class="hele-breedte">
            <button class="toevoegen" type="submit">
              Toevoegen aan weekagenda
            </button>
          </div>
        </div>
      </form>

      <div class="legenda">
        <span style="background:#fde047;">Economie</span>
        <span style="background:#fca5a5;">Mens en maatschappij</span>
        <span style="background:#93c5fd;">Nederlands</span>
        <span style="background:#86efac;">Engels</span>
        <span style="background:#d8b4fe;">Wiskunde</span>
        <span style="background:#f9a8d4;">Biologie</span>
        <span style="background:#dc2626;color:white;">Toets: altijd rood</span>
      </div>
    </section>

    <section class="kaart">
      <div class="weekbediening">
        <button id="vorige-week" type="button">← Vorige week</button>
        <h2 id="week-titel">Weekoverzicht</h2>
        <button id="volgende-week" type="button">Volgende week →</button>
      </div>

      <button id="deze-week" class="vandaag-knop" type="button">
        Deze week
      </button>

      <div class="agenda-buitenrand">
        <div id="weekagenda"></div>
      </div>
    </section>
  </main>

  <script>
    const kleuren = {
      "Economie": "#fde047",
      "Mens en maatschappij": "#fca5a5",
      "Nederlands": "#93c5fd",
      "Engels": "#86efac",
      "Wiskunde": "#d8b4fe",
      "Biologie": "#f9a8d4"
    };

    const toetsKleur = "#dc2626";

    const formulier = document.getElementById("taak-formulier");
    const datumVeld = document.getElementById("datum");
    const weekagenda = document.getElementById("weekagenda");
    const weekTitel = document.getElementById("week-titel");

    let taken = JSON.parse(localStorage.getItem("mijnSchooltaken")) || [];
    let getoondeMaandag = bepaalMaandag(new Date());

    datumVeld.value = maakDatumCode(new Date());

    formulier.addEventListener("submit", function (gebeurtenis) {
      gebeurtenis.preventDefault();

      const nieuweTaak = {
        id: Date.now(),
        datum: datumVeld.value,
        vak: document.getElementById("vak").value,
        soort: document.getElementById("soort").value,
        omschrijving: document.getElementById("omschrijving").value.trim(),
        klaar: false
      };

      taken.push(nieuweTaak);
      bewaarTaken();

      getoondeMaandag = bepaalMaandag(
        new Date(nieuweTaak.datum + "T12:00:00")
      );

      formulier.reset();
      datumVeld.value = maakDatumCode(new Date());
      toonWeek();
    });

    document.getElementById("vorige-week").addEventListener("click", function () {
      getoondeMaandag.setDate(getoondeMaandag.getDate() - 7);
      toonWeek();
    });

    document.getElementById("volgende-week").addEventListener("click", function () {
      getoondeMaandag.setDate(getoondeMaandag.getDate() + 7);
      toonWeek();
    });

    document.getElementById("deze-week").addEventListener("click", function () {
      getoondeMaandag = bepaalMaandag(new Date());
      toonWeek();
    });

    function bepaalMaandag(datum) {
      const nieuweDatum = new Date(datum);
      nieuweDatum.setHours(12, 0, 0, 0);

      const dagnummer = nieuweDatum.getDay();
      const verschil = dagnummer === 0 ? -6 : 1 - dagnummer;

      nieuweDatum.setDate(nieuweDatum.getDate() + verschil);
      return nieuweDatum;
    }

    function maakDatumCode(datum) {
      const jaar = datum.getFullYear();
      const maand = String(datum.getMonth() + 1).padStart(2, "0");
      const dag = String(datum.getDate()).padStart(2, "0");

      return `${jaar}-${maand}-${dag}`;
    }

    function bewaarTaken() {
      localStorage.setItem("mijnSchooltaken", JSON.stringify(taken));
    }

    function vinkTaakAf(id) {
      const taak = taken.find(function (taak) {
        return taak.id === id;
      });

      if (taak) {
        taak.klaar = !taak.klaar;
        bewaarTaken();
        toonWeek();
      }
    }

    function verwijderTaak(id) {
      taken = taken.filter(function (taak) {
        return taak.id !== id;
      });

      bewaarTaken();
      toonWeek();
    }

    function maakTaakElement(taak) {
      const isToets = taak.soort === "Toets";
      const gebruikteKleur = isToets ? toetsKleur : kleuren[taak.vak];

      const taakElement = document.createElement("div");
      taakElement.className = taak.klaar ? "taak klaar" : "taak";
      taakElement.style.borderTopColor = gebruikteKleur;

      const bovenkant = document.createElement("div");
      bovenkant.className = "taak-bovenkant";

      const vinkje = document.createElement("input");
      vinkje.type = "checkbox";
      vinkje.className = "afvinken";
      vinkje.checked = taak.klaar;
      vinkje.addEventListener("change", function () {
        vinkTaakAf(taak.id);
      });

      const inhoud = document.createElement("div");
      inhoud.className = "taak-inhoud";

      const vak = document.createElement("span");
      vak.className = "vak";
      vak.textContent = isToets ? "TOETS: " + taak.vak : taak.vak;
      vak.style.backgroundColor = gebruikteKleur;

      if (isToets) {
        vak.style.color = "white";
      }

      const omschrijving = document.createElement("p");
      omschrijving.className = "taak-tekst";
      omschrijving.textContent = taak.omschrijving;

      const soort = document.createElement("p");
      soort.className = isToets ? "taak-soort toets-melding" : "taak-soort";
      soort.textContent = taak.soort;

      inhoud.appendChild(vak);
      inhoud.appendChild(omschrijving);
      inhoud.appendChild(soort);

      bovenkant.appendChild(vinkje);
      bovenkant.appendChild(inhoud);

      const verwijderKnop = document.createElement("button");
      verwijderKnop.className = "verwijderen";
      verwijderKnop.type = "button";
      verwijderKnop.textContent = "Verwijderen";
      verwijderKnop.addEventListener("click", function () {
        verwijderTaak(taak.id);
      });

      taakElement.appendChild(bovenkant);
      taakElement.appendChild(verwijderKnop);

      return taakElement;
    }

    function toonWeek() {
      weekagenda.innerHTML = "";

      const zondag = new Date(getoondeMaandag);
      zondag.setDate(zondag.getDate() + 6);

      weekTitel.textContent =
        getoondeMaandag.toLocaleDateString("nl-NL", {
          day: "numeric",
          month: "short"
        }) +
        " t/m " +
        zondag.toLocaleDateString("nl-NL", {
          day: "numeric",
          month: "short",
          year: "numeric"
        });

      const vandaagCode = maakDatumCode(new Date());

      for (let nummer = 0; nummer < 7; nummer++) {
        const datum = new Date(getoondeMaandag);
        datum.setDate(getoondeMaandag.getDate() + nummer);

        const datumCode = maakDatumCode(datum);
        const dagElement = document.createElement("div");
        dagElement.className =
          datumCode === vandaagCode ? "dag vandaag" : "dag";

        const dagkop = document.createElement("div");
        dagkop.className = "dagkop";

        const dagNaam = document.createElement("h3");
        dagNaam.textContent = datum.toLocaleDateString("nl-NL", {
          weekday: "long"
        });

        const dagDatum = document.createElement("p");
        dagDatum.textContent = datum.toLocaleDateString("nl-NL", {
          day: "numeric",
          month: "long"
        });

        dagkop.appendChild(dagNaam);
        dagkop.appendChild(dagDatum);

        const takenVak = document.createElement("div");
        takenVak.className = "taken";

        const takenVanDag = taken.filter(function (taak) {
          return taak.datum === datumCode;
        });

        if (takenVanDag.length === 0) {
          const legeTekst = document.createElement("p");
          legeTekst.className = "geen-taken";
          legeTekst.textContent = "Nog niets ingepland";
          takenVak.appendChild(legeTekst);
        } else {
          takenVanDag.forEach(function (taak) {
            takenVak.appendChild(maakTaakElement(taak));
          });
        }

        dagElement.appendChild(dagkop);
        dagElement.appendChild(takenVak);
        weekagenda.appendChild(dagElement);
      }
    }

    toonWeek();
  </script>
</body>
</html>
